name: sync sutra version

# The site never carries a hand-written tag. This workflow reads the latest
# release from g0GobliN/sutra, commits the snapshot, and the push redeploys
# the site. A new tag therefore needs no site edit at all.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sutra-release]

permissions:
  contents: write

concurrency:
  group: version-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve the latest SUTRA release
        run: node scripts/sync-version.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push when the tag moved
        run: |
          if git diff --quiet -- version.json public/version.json; then
            echo "version snapshot already current"
            exit 0
          fi
          git config user.name "sutra-version-bot"
          git config user.email "actions@users.noreply.github.com"
          git add version.json public/version.json
          git commit -m "chore: sync site version to the latest sutra release"
          git push
